<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
</head>
<body>
<div class="js-container"></div>
<script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
<script src="https://unpkg.com/supersimpledev/babel.js"></script>
<script type="text/babel">

    function ChatInput() {
        return (
            <>
                <input type="text" placeholder="Send a Message To Chatbot" size="30"/>
                
                <button>Send</button>
            </>
        )
    }
    
    function ChatMessage(props){
        const {sender, message} = props;
        const messageDate = dayjs().format('YYYY-MM-DD HH:mm:ss');
        

        // if(sender === "bot"){
        //     return (
        //         <div>
        //         <img src="robot.png" width="45"/>
        //         {message}
                
                
        //         </div>
        //     )
        // }
            return (
                <div>
                {sender=== 'bot'&& (
                    <img src="robot.png" width="45"/>
                )}
                {message}
                {sender=== 'user'&& (
                    <img src="user.png" width="45"/>
                )}
                    
                </div>
            )
        }
        
    function ChatMessages(){
        const array = React.useState([{
            sender: "user",
            message: "hello Chatbot",
            id: 1


        }, {
            message: "Hi Atharva, How can I Help You ?",
            sender: "bot",
            id:2
        },{
            message: "what is the weather today ? ",
            sender: "user",
            id:3
        }, {
            message: "The Weather is Sunny Today ",
            sender: "bot",
            id: 4
        }]);
        const chatMessages = array[0];
        const setChatMessages = array[1];

        function SendMessage(){
        
            setChatMessages([...chatMessages, {
                    sender: "user",
                    message: "What is the time now ?",
                    id: crypto.randomUUID()
                }])
        }
        
        
        return(
            <>
                <button onClick={SendMessage}>Send Message</button>
                
                
                {chatMessages.map((chatMessage)=>{
                    return(
                        <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                />
            )
        })}
            </>
        )


    }
    
    function App(){

        return (
            < >
                <ChatInput/>
                <ChatMessages/>
            </>
        )
    }


    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(App())
</script>
<script type="module" src="react-basics.js"></script>
</body>
</html>
