<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
</head>
<body>
<div class="js-container"></div>
<script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
<script src="https://unpkg.com/supersimpledev/babel.js"></script>
<script type="text/babel">

    function ChatInput() {
        return (
            <>
                <input type="text" placeholder="Send a Message To Chatbot" size="30"/>
                
                <button>Send</button>
            </>
        )
    }
    
    function ChatMessage(props){
        const {sender, message} = props;
        const messageDate = dayjs().format('YYYY-MM-DD HH:mm:ss');
        

        // if(sender === "bot"){
        //     return (
        //         <div>
        //         <img src="robot.png" width="45"/>
        //         {message}
                
                
        //         </div>
        //     )
        // }
            return (
                <div>
                {sender=== 'bot'&& <img src="robot.png" width="45"/>}
                {message}
                    {messageDate}
                {sender=== 'user'&& <img src="user.png" width="45"/>}
                    {messageDate}
                </div>
            )
        }
        
    
    

    const app = (
        < >
            <ChatInput/>
            <ChatMessage message="hello Chatbot" sender="user"/>
            <ChatMessage message="Hi Atharva, How can I Help You ? " sender="bot" />
            <ChatMessage message="What is the Weather Today ? " sender="user"/>
            <ChatMessage message="The Weather is Sunny Today " sender="bot"/>
            <ChatMessage message="Thank you !!" sender="user"/>
            
        </>
    )

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(app)
</script>
<script type="module" src="react-basics.js"></script>
</body>
</html>
